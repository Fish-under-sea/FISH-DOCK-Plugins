<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#161618;--card:#1f1f22;--line:#3a3a3f;--ink:#e8e8ea;--dim:#9a9aa2;--pill:#1a1a1d}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:26px}
.row{display:flex;align-items:center;gap:26px;max-width:1000px;margin:0 auto 22px}
.lbl{flex:0 0 130px;color:var(--dim);font-size:12.5px}
.chips{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--pill);white-space:nowrap;font-size:13.5px}
.caret{opacity:.55;font-size:11px;margin-left:1px}
.chip.small{width:96px;justify-content:center;font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#6ea8ff,#8b6bff);display:inline-block}
</style></head><body>
<div class="row"><div class="lbl">真实页面：识图行</div><div class="chips"><span class="chip"><span class="ico"></span>DeepSeek-V4.1-Flash · 付费组 · deepseek</span><span class="chip small">默认</span></div></div>
<div class="row"><div class="lbl">新：生图行</div><div class="chips"><span class="chip"><span class="ico"></span>gpt-image-2.5-flare · NearToken</span><span class="chip small">5 分钟 <span class="caret">▾</span></span></div></div>
<div class="row"><div class="lbl">新：视频行</div><div class="chips"><span class="chip"><span class="ico" style="background:#6b6b74"></span>sd2.5 · NearToken</span><span class="chip small">15 分钟 <span class="caret">▾</span></span></div></div>
<div class="row"><div class="lbl">新：语音行</div><div class="chips"><span class="chip"><span class="ico"></span>gemini-3.8-flash-tts · NearToken</span><span class="chip small">5 分钟 <span class="caret">▾</span></span></div></div>
</body></html>
