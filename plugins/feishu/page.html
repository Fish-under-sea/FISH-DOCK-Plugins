<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞书通知</title><link rel="stylesheet" href="../../shared/dock.css"><link rel="stylesheet" href="page.css"><script src="page.js" defer></script></head><body><main><header><div><h1>飞书通知</h1><p>将需要确认、完成和错误通知发送到群机器人。</p></div><div class="layouts" aria-label="页面布局"><button type="button" data-layout="single" aria-pressed="true">单栏</button><button type="button" data-layout="double" aria-pressed="false">双栏</button></div></header><p id="status" role="status" aria-live="polite">正在读取配置…</p><form id="settings"><fieldset disabled id="fields"><legend>群机器人</legend><label for="webhook">Webhook 地址</label><input id="webhook" type="url" autocomplete="off" spellcheck="false" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/…"><p id="saved">尚未配置</p><label for="secret">签名密钥</label><input id="secret" type="password" autocomplete="new-password"><p>留空保留现有地址和密钥。密钥由当前 Windows 用户加密保存。</p><label class="check"><input type="checkbox" id="enabled">启用自动通知</label><div class="filters"><label class="check"><input type="checkbox" id="waiting">需要确认</label><label class="check"><input type="checkbox" id="done">任务完成</label><label class="check"><input type="checkbox" id="error">发生错误</label></div><label class="check"><input type="checkbox" id="clearSecret">移除签名密钥</label><div class="actions"><button type="submit">保存配置</button><button type="button" id="test">发送测试通知</button><button type="button" id="refresh">刷新</button></div></fieldset></form><section><h2>最近发送</h2><p id="last">尚无发送记录</p><p class="note">自动通知附工作区、仓库和会话标识。每分钟最多 20 条，相同事件 5 秒内去重。测试发送独立于自动通知开关。</p></section></main></body></html>
