<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞书通知</title>
<link rel="stylesheet" href="../../shared/dock.css">
<link rel="stylesheet" href="page.css">
<script src="page.js" defer></script>
</head>
<body>
<main data-layout="single">
 <header>
  <div class="head-text">
   <h1>飞书通知</h1>
   <p class="lede">将需要确认、完成和错误通知发送到群机器人。</p>
  </div>
  <div class="segmented" role="group" aria-label="页面布局">
   <button type="button" data-layout="single" aria-pressed="true">单栏</button>
   <button type="button" data-layout="double" aria-pressed="false">双栏</button>
  </div>
 </header>
 <p id="status" class="banner" role="status" aria-live="polite" data-tone="idle">正在读取配置…</p>
 <div class="board">
  <form id="settings" class="card">
   <fieldset id="fields" disabled>
    <legend class="card-title">通知配置</legend>
    <div class="group">
     <p class="group-title">群机器人</p>
     <div class="field-set">
      <div class="field">
       <label for="webhook">Webhook 地址</label>
       <input id="webhook" type="url" autocomplete="off" spellcheck="false" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/…">
       <p id="saved" class="field-note" data-tone="muted">尚未配置</p>
      </div>
      <div class="field">
       <label for="secret">签名密钥</label>
       <input id="secret" type="password" autocomplete="new-password">
       <p class="field-note muted">留空保留现有地址和密钥。密钥由当前 Windows 用户加密保存。</p>
      </div>
     </div>
     <label class="check"><input type="checkbox" id="enabled">启用自动通知</label>
     <label class="check"><input type="checkbox" id="clearSecret">移除签名密钥</label>
    </div>
    <div class="group">
     <p class="group-title">通知范围</p>
     <div class="filters">
      <label class="check"><input type="checkbox" id="waiting">需要确认</label>
      <label class="check"><input type="checkbox" id="done">任务完成</label>
      <label class="check"><input type="checkbox" id="error">发生错误</label>
     </div>
    </div>
    <div class="actions">
     <button type="submit">保存配置</button>
     <button type="button" id="test">发送测试通知</button>
     <button type="button" id="refresh">刷新</button>
     <button type="button" id="clear" class="danger">清除机器人配置</button>
    </div>
    <div id="clear-confirm" hidden role="group" aria-label="确认清除机器人">
     <p>清除保存的 Webhook 和签名密钥，并关闭自动通知。事件筛选设置保留。</p>
     <p class="irreversible">清除后需重新填写 Webhook 与密钥才能再次通知，此操作不可撤销。</p>
     <div class="actions">
      <button type="button" id="cancel-clear">取消</button>
      <button type="button" id="confirm-clear" class="danger">确认清除</button>
     </div>
    </div>
   </fieldset>
  </form>
  <section class="card side-card">
   <h2 class="card-title">最近发送</h2>
   <p id="last" class="record" data-tone="empty">尚无发送记录</p>
   <div class="note-list">
    <p class="note">自动通知附工作区、仓库和会话标识。</p>
    <p class="note">每分钟最多 20 条。</p>
    <p class="note">相同事件 5 秒内重复则只发一次。</p>
   </div>
  </section>
 </div>
</main>
</body>
</html>
