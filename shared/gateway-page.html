<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="dock.css"><link rel="stylesheet" href="gateway-page.css"><title>模型服务</title></head><body><main><header><div class="identity"><h1 id="title">模型服务</h1><span id="state" role="status">正在加载…</span><span id="connection"></span></div><nav aria-label="服务操作"><button id="autostart" class="ghost hook" aria-pressed="false" title="随 Dock 启动就拉起本机服务">自启动</button><button id="start" class="primary">启动服务</button><button id="stop">停止服务</button><button id="refresh">刷新状态</button><button id="settings" aria-expanded="false" aria-controls="configuration">服务设置</button></nav></header><p id="error" role="alert"></p><section id="intro"><h2>管理模型与账号</h2><p>启动后，管理界面会直接显示在这里。服务仅在本机运行。</p><button id="open">打开管理界面</button></section><section id="configuration" hidden><h2>服务设置</h2><p class="note">修改路径或端口前，请先停止服务。</p><form id="form"><label>服务文件路径<input id="executable" required autocomplete="off" spellcheck="false"></label><label>本机端口<input id="port" type="number" min="1024" max="65535" required></label><button type="submit">保存配置</button></form></section></main><script src="gateway-page.js"></script></body></html>
